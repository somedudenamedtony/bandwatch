<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d4f49"/>
      <stop offset="1" stop-color="#061f1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="390" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- full-bleed background (maskable) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- propagation rings radiating from the station -->
  <g fill="none" stroke="#5eead4" stroke-linecap="round">
    <path d="M136 376 A120 120 0 0 1 376 376" stroke-opacity="0.16" stroke-width="5"/>
    <path d="M96 376 A160 160 0 0 1 416 376" stroke-opacity="0.11" stroke-width="5"/>
    <path d="M56 376 A200 200 0 0 1 456 376" stroke-opacity="0.07" stroke-width="5"/>
  </g>

  <!-- band activity bars -->
  <g>
    <rect x="148" y="296" width="24" height="80" rx="12" fill="url(#bar)" opacity="0.75"/>
    <rect x="184" y="248" width="24" height="128" rx="12" fill="url(#bar)" opacity="0.85"/>
    <rect x="220" y="196" width="24" height="180" rx="12" fill="url(#bar)"/>
    <rect x="256" y="150" width="24" height="226" rx="12" fill="url(#hot)"/>
    <rect x="292" y="220" width="24" height="156" rx="12" fill="url(#bar)"/>
    <rect x="328" y="272" width="24" height="104" rx="12" fill="url(#bar)" opacity="0.85"/>
    <rect x="364" y="316" width="0" height="0"/>
  </g>

  <!-- signal trace over the bars -->
  <path d="M120 330 C 170 330, 190 230, 232 196 S 262 140, 268 140 S 300 170, 316 214 S 360 300, 392 300"
        fill="none" stroke="#fde68a" stroke-width="10" stroke-linecap="round" filter="url(#soft)" opacity="0.6"/>
  <path d="M120 330 C 170 330, 190 230, 232 196 S 262 140, 268 140 S 300 170, 316 214 S 360 300, 392 300"
        fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>

  <!-- the station -->
  <circle cx="268" cy="140" r="11" fill="#ffffff"/>
  <circle cx="268" cy="140" r="20" fill="none" stroke="#fde68a" stroke-width="4" opacity="0.8"/>

  <!-- ground line -->
  <rect x="132" y="376" width="248" height="6" rx="3" fill="#5eead4" opacity="0.5"/>
</svg>
